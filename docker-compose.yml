name: ganpat-iam
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/000-create-databases.sh:/docker-entrypoint-initdb.d/000-create-databases.sh:ro
      - ./db/001-init-schema.sh:/docker-entrypoint-initdb.d/001-init-schema.sh:ro
      - ./db/init.sql:/db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Copy .env.example to .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Copy .env.example to .env}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '{ printf \"HEAD /health/ready HTTP/1.0\\r\\n\\r\\n\" >&0; grep \"HTTP/1.0 200\"; } 0<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 30
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Ganpat University"
      LDAP_DOMAIN: "ganpat.local"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Copy .env.example to .env}
      LDAP_TLS: "false"
    ports: ["1389:389"]
    volumes:
      - ldapdata:/var/lib/ldap
      - ldapconf:/etc/ldap/slapd.d
      - ./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-seed.ldif
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=ganpat,dc=local", "-D", "cn=admin,dc=ganpat,dc=local", "-w", "${LDAP_ADMIN_PASSWORD}", "(objectClass=organizationalUnit)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
  keycloak-config:
    image: quay.io/keycloak/keycloak:26.4.0
    entrypoint: ["/bin/bash", "/opt/keycloak/scripts/setup.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Copy .env.example to .env}
      IAM_SERVICE_CLIENT_SECRET: ${IAM_SERVICE_CLIENT_SECRET:?Copy .env.example to .env}
    volumes:
      - ./keycloak/scripts:/opt/keycloak/scripts:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:?Copy .env.example to .env}@postgres:5432/portal
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ganpat-iam
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/ganpat-iam/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: ganpat-iam
      KEYCLOAK_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Copy .env.example to .env}
      IAM_SERVICE_CLIENT_ID: iam-governance-service
      IAM_SERVICE_CLIENT_SECRET: ${IAM_SERVICE_CLIENT_SECRET:?Copy .env.example to .env}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      keycloak-config: {condition: service_completed_successfully}
  portal:
    build: ./portal
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: ganpat-iam
      VITE_KEYCLOAK_CLIENT_ID: iam-portal
      VITE_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [backend, keycloak]
  student-portal:
    build: ./apps/student-portal
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: ganpat-iam
      VITE_KEYCLOAK_CLIENT_ID: student-portal
      VITE_API_URL: http://localhost:4000
    ports: ["3001:3000"]
    depends_on: [keycloak, backend]
  library-portal:
    build: ./apps/library-portal
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: ganpat-iam
      VITE_KEYCLOAK_CLIENT_ID: library-portal
      VITE_API_URL: http://localhost:4000
    ports: ["3002:3000"]
    depends_on: [keycloak, backend]
  saml-sp:
    build: ./apps/saml-sp
    environment:
      PORT: 3000
      KEYCLOAK_URL: http://keycloak:8080
    ports: ["3003:3000"]
    depends_on: [keycloak]
volumes:
  pgdata:
  ldapdata:
  ldapconf:
